<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Carros - Sistema</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        fieldset { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        legend { font-weight: bold; color: #333; }
        input, select, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold;}
        button:hover { background-color: #218838; }
        button.btn-delete { background-color: #dc3545; width: auto; padding: 5px 10px; margin-left: 10px;}
        button.btn-delete:hover { background-color: #c82333; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f8f9fa; margin: 5px 0; padding: 10px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center;}
        
        .escondido { display: none !important; }
        .cabecalho-usuario { background-color: #007bff; color: white; padding: 10px; border-radius: 5px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;}
        .cabecalho-usuario button { background-color: #dc3545; width: auto; }
        .secao-titulo { border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-top: 30px; }
    </style>
</head>
<body>

<div class="container" id="telaLogin">
    <h1 style="text-align: center;">Bem-vindo à Loja de Carros</h1>
    <fieldset>
        <legend>Faça o seu Login</legend>
        <form id="formLogin">
            <input type="email" id="loginEmail" placeholder="E-mail" required>
            <input type="password" id="loginSenha" placeholder="Senha" required>
            <button type="submit" style="background-color: #007bff;">Entrar no Sistema</button>
        </form>
    </fieldset>
</div>

<div class="container escondido" id="telaSistema">
    
    <div class="cabecalho-usuario">
        <span id="infoUsuarioLogado"></span>
        <button onclick="sair()">Sair</button>
    </div>

    <div id="secaoUsuarios">
        <h2 class="secao-titulo">Gestão de Utilizadores</h2>
        <fieldset>
            <legend>Registar Novo Utilizador</legend>
            <form id="formCadastro">
                <input type="text" id="nome" placeholder="Nome Completo" required>
                <input type="email" id="email" placeholder="E-mail" required>
                <input type="password" id="senha" placeholder="Senha" required>
                <select id="cargoNovo" required>
                    <option value="CLIENTE">Cliente</option>
                    <option value="VENDEDOR">Vendedor</option>
                    <option value="ADMINISTRADOR">Administrador</option>
                </select>
                <button type="submit">Registar Utilizador</button>
            </form>
        </fieldset>

        <button onclick="carregarUsuarios()" style="background-color: #17a2b8; margin-bottom: 15px;">Atualizar Lista de Utilizadores</button>
        <ul id="listaUsuarios"></ul>
    </div>

    <div id="secaoCarros">
        <h2 class="secao-titulo">Catálogo de Carros</h2>
        <button onclick="carregarCarros()" style="background-color: #17a2b8; margin-bottom: 15px;">Atualizar Catálogo</button>
        <ul id="listaCarros"></ul>
    </div>

</div>

<script>
    const API_USUARIOS = 'http://localhost:8081/usuarios';
    const API_CARROS = 'http://localhost:8080/carro'; 
    
    let sessaoAtual = null;

    function getHeaders() {
        return {
            'Content-Type': 'application/json',
            'Cargo-Usuario-Logado': sessaoAtual.cargo,
            'Id-Usuario-Logado': String(sessaoAtual.id),
            'idUsuario': String(sessaoAtual.id)
        };
    }

    document.getElementById('formLogin').addEventListener('submit', async function(event) {
        event.preventDefault();

        const credenciais = {
            email: document.getElementById('loginEmail').value,
            senha: document.getElementById('loginSenha').value
        };

        try {
            const resposta = await fetch(`${API_USUARIOS}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(credenciais)
            });

            if (resposta.ok) {
                sessaoAtual = await resposta.json(); 
                
                document.getElementById('telaLogin').classList.add('escondido');
                document.getElementById('telaSistema').classList.remove('escondido');
                
                document.getElementById('infoUsuarioLogado').innerText = `Logado como: ${sessaoAtual.nome} (${sessaoAtual.cargo})`;
                
                if (sessaoAtual.cargo === 'CLIENTE') {
                    document.getElementById('secaoUsuarios').classList.add('escondido');
                } else {
                    document.getElementById('secaoUsuarios').classList.remove('escondido');
                    carregarUsuarios(); 
                }

                carregarCarros();
            } else {
                const erro = await resposta.text();
                alert('Erro ao entrar: ' + erro);
            }
        } catch (error) {
            alert('Falha ao conectar com o servidor. Verifique se a API de Usuários (8081) está rodando.');
        }
    });

    function sair() {
        sessaoAtual = null;
        document.getElementById('formLogin').reset();
        document.getElementById('telaSistema').classList.add('escondido');
        document.getElementById('telaLogin').classList.remove('escondido');
        document.getElementById('listaUsuarios').innerHTML = '';
        document.getElementById('listaCarros').innerHTML = '';
    }

    async function carregarUsuarios() {
        if (!sessaoAtual || sessaoAtual.cargo === 'CLIENTE') return; 

        try {
            const resposta = await fetch(API_USUARIOS, { headers: getHeaders() });
            const usuarios = await resposta.json();
            const lista = document.getElementById('listaUsuarios');
            lista.innerHTML = ''; 

            usuarios.forEach(usuario => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span><strong>ID ${usuario.id}:</strong> ${usuario.nome} (${usuario.email}) - <b>${usuario.cargo}</b></span>
                    <button class="btn-delete" onclick="deletarUsuario(${usuario.id})">Excluir</button>
                `;
                lista.appendChild(li);
            });
        } catch(error) {
            console.error('Erro ao carregar usuários:', error);
        }
    }

    async function carregarCarros() {
        if (!sessaoAtual) return; 

        try {
            const resposta = await fetch(`${API_CARROS}/listarCarros`, { headers: getHeaders() });
            if (resposta.ok) {
                const carros = await resposta.json();
                const lista = document.getElementById('listaCarros');
                lista.innerHTML = ''; 

                carros.forEach(carro => {
                    const li = document.createElement('li');
                    const detalhes = `${carro.modelo} - Ano: ${carro.ano} - R$ ${carro.preco}`;
                    li.innerHTML = `<span><strong>ID ${carro.id}:</strong> ${detalhes}</span>`;
                    lista.appendChild(li);
                });
            }
        } catch (error) {
            console.error('Falha na ligação com a API de Carros (8080).');
        }
    }

    document.getElementById('formCadastro').addEventListener('submit', async function(event) {
        event.preventDefault();

        const novoUsuario = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
            cargo: document.getElementById('cargoNovo').value
        };

        const resposta = await fetch(API_USUARIOS, {
            method: 'POST',
            headers: getHeaders(), 
            body: JSON.stringify(novoUsuario)
        });

        if (resposta.ok) {
            alert('Utilizador registado com sucesso!');
            document.getElementById('formCadastro').reset(); 
            carregarUsuarios(); 
        } else {
            const mensagemErro = await resposta.text();
            alert('Ação Negada:\n' + mensagemErro);
        }
    });

    async function deletarUsuario(id) {
        if (!confirm('Tem a certeza que deseja excluir o utilizador ID ' + id + '?')) return;

        const resposta = await fetch(`${API_USUARIOS}/${id}`, {
            method: 'DELETE',
            headers: getHeaders() 
        });

        if (resposta.ok) {
            alert('Utilizador excluído com sucesso!');
            carregarUsuarios();
        } else {
            const mensagemErro = await resposta.text();
            alert('Ação Negada:\n' + mensagemErro);
        }
    }
</script>

</body>
</html>
